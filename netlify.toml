[build]
  base = ""
  command = "pnpm install --no-frozen-lockfile && pnpm build:ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-frozen-lockfile"
  PNPM_FLAGS = "--no-frozen-lockfile"

# Redirect all routes to index.html for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production environment
[context.production.environment]
  NODE_ENV = "production"

# Deploy preview environment
[context.deploy-preview.environment]
  NODE_ENV = "development"

# Branch deploy environment
[context.branch-deploy.environment]
  NODE_ENV = "development"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Scripts only from this origin, plus the inline theme script in
    # index.html by hash (src/securityHeaders.test.js fails if they drift).
    # API calls go to Railway; data:/blob: cover exported images and the
    # receipt image blob. Inline styles are needed by React style props.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-cILSjtW3tjNyySvscL5YY4kYDkDH3ZHLXVSe7njTRpA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.railway.app data: blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"