<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="AI-powered voice grocery list with smart categorization and auto-correction" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Grocery List" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grocery List" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Disable tap highlight on mobile -->
    <meta name="msapplication-tap-highlight" content="no" />
    <!-- Apply the saved/system theme before first paint (ThemeContext takes over after mount) -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('themeMode');
          var dark = mode === 'dark' || ((!mode || mode === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) { /* storage blocked: stay light */ }
      })();
    </script>
    <title>Grocery List - Smart Voice Shopping Lists</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
